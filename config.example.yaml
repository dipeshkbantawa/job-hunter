# Copy to config.yaml and edit. config.yaml, cv/ and data/ are git-ignored.

profile:                      # used to autofill application forms
  first_name: Your
  last_name: Name
  email: you@example.com
  phone: "+977 98XXXXXXXX"
  location: Kathmandu, Nepal
  linkedin: https://www.linkedin.com/in/your-handle
  github: https://github.com/your-handle
  website: ""
  current_company: ""
  current_title: Systems Administrator
  years_experience: 5
  notice_period: 30 days
  salary_expectation: ""
  resume: output/Firstname_Lastname_Target_Role_CV.pdf   # built by `cv build` from cv.yaml (or your own PDF/DOCX)
  cover_letter: ""             # optional file attached to "cover letter" upload fields

search:
  keywords:                    # each keyword is searched separately; matched against job titles
    - system administrator
    - systems engineer
    - devops engineer
    - cloud engineer
    - infrastructure engineer
    - site reliability
    - network engineer
    - security engineer
    - security analyst
    - IT support
    - technical support
    - IT manager
  skills:                      # each skill found in a posting adds to its score
    [Microsoft 365, Exchange Online, Azure, Entra ID, Intune, PowerShell, Python,
     Active Directory, Linux, Windows Server, AWS, Docker, Kubernetes, Terraform,
     networking, security, SIEM, Defender]
  must_have_any: []            # optional: posting must contain at least one of these
  exclude:                     # drop postings containing any of these
    - US citizens only
    - security clearance
    - must reside in the US
    - "W2 only"
  regions:                     # your priority order. Jobs outside these are dropped.
    - Remote                   # remote open worldwide / APAC / Asia (not "Remote - USA only")
    - Australia
    - New Zealand
    - South Korea
    - Dubai
    - Singapore
    - Nepal
  drop_no_sponsorship: true    # drop on-site jobs abroad whose ad says it won't sponsor a visa
  max_age_days: 14
  # board_max_age_days: 7      # also age-limit company boards; `search --days 7` sets both for one run
  min_score: 30
  sources: [remotive, jobicy, remoteok, arbeitnow, himalayas, weworkremotely, greenhouse, lever, ashby, smartrecruiters, careers]
  # companies.yaml already lists about 100 company boards; these lists add your own.
  # ashby_companies: []        # slug from jobs.ashbyhq.com/<slug>
  # smartrecruiters_companies: []   # slug from jobs.smartrecruiters.com/<slug>
  greenhouse_boards:           # company slug from boards.greenhouse.io/<slug>
    - coupang                  # South Korea
    - careem                   # Dubai
    - sendbird                 # South Korea
    - canonical                # remote worldwide
    - gitlab                   # remote worldwide
  lever_companies:             # company slug from jobs.lever.co/<slug>
    - ninjavan                 # Singapore
    - deputy                   # Australia
  google_cse:                  # optional: https://programmablesearchengine.google.com
    api_key: ""
    cx: ""

apply:                         # `hunter apply`: you still review and click Submit on every form
  daily_limit: 50              # stops the queue at this many applications a day
  min_score: 50                # the queue skips weaker matches (ids you name are always opened)

browser:
  channel: chrome              # use your installed Chrome ("msedge" for Edge, "" for bundled Chromium)

blacklist:                     # companies you won't apply to (skipped by search, refused by add)
  # - company: Example Corp
  #   reason: bad interview experience

company_careers:               # employers to watch: scanned by `search` and shown under their region in the digest
  Dubai:
    - name: du
      url: https://www.du.ae/about-us/careers
  Nepal:
    - name: SDOC (Government of Nepal software office)
      url: https://sdoc.gov.np/vacancies
  # Australia:
  #   - name: Some Company
  #     url: https://example.com/careers

career_sites:                  # opened by `python -m hunter update-cv` and listed in the digest
  - name: LinkedIn (Easy Apply resumes)
    url: https://www.linkedin.com/jobs/application-settings/
  - name: Indeed (all countries)
    url: https://profile.indeed.com/
  - name: Glassdoor
    url: https://www.glassdoor.com/member/profile/index.htm
  - name: Wellfound
    url: https://wellfound.com/profile/edit/overview
  - name: Himalayas
    url: https://himalayas.app/profile
  - name: Seek (Australia + NZ)
    url: https://au.seek.com/profile/me
  - name: SEEK Pass (verified credentials for Seek)
    url: https://seekpass.co/
  - name: Bayt (Dubai / UAE)
    url: https://www.bayt.com/en/myworkspace/
  - name: Naukrigulf (Dubai / UAE)
    url: https://www.naukrigulf.com/
  - name: GulfTalent (Dubai / UAE)
    url: https://www.gulftalent.com/
  - name: JobStreet (Singapore)
    url: https://sg.jobstreet.com/profile
  - name: Wanted (South Korea)
    url: https://www.wanted.co.kr/cv/list
  - name: Kowork (South Korea, jobs for foreigners)
    url: https://kowork.kr/en
  - name: JobKorea (South Korea)
    url: https://www.jobkorea.co.kr/
  - name: Merojob (Nepal)
    url: https://merojob.com/
  - name: Kumarijob (Nepal)
    url: https://www.kumarijob.com/
